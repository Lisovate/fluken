<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050a18"/>
      <stop offset="0.5" stop-color="#0a1628"/>
      <stop offset="1" stop-color="#0e1d3a"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4d6bfe" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#4d6bfe" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sdk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6478ff"/>
      <stop offset="1" stop-color="#8b7bff"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4d6bfe"/>
      <stop offset="1" stop-color="#5b8bff"/>
    </linearGradient>
    <linearGradient id="dsml" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2e4ad9"/>
      <stop offset="1" stop-color="#3a5fc2"/>
    </linearGradient>
    <linearGradient id="fluke1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#93c5fd"/>
      <stop offset="1" stop-color="#4d6bfe"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg1)"/>
  <ellipse cx="600" cy="340" rx="700" ry="320" fill="url(#glow1)"/>

  <!-- subtle wave pattern -->
  <g opacity="0.06" stroke="#93c5fd" stroke-width="1" fill="none">
    <path d="M0 580 Q 100 560 200 580 T 400 580 T 600 580 T 800 580 T 1000 580 T 1200 580"/>
    <path d="M0 610 Q 100 590 200 610 T 400 610 T 600 610 T 800 610 T 1000 610 T 1200 610"/>
    <path d="M0 640 Q 100 620 200 640 T 400 640 T 600 640 T 800 640 T 1000 640 T 1200 640"/>
  </g>

  <!-- Wordmark + fluke logo -->
  <g transform="translate(80, 90)">
    <!-- small fluke glyph -->
    <g transform="translate(0, 0) scale(0.5)">
      <path d="M 50 60 Q 30 30 0 20 Q 25 5 60 20 Q 80 35 90 50 Q 100 35 120 20 Q 155 5 180 20 Q 150 30 130 60 Q 110 80 90 70 Q 70 80 50 60 Z"
            fill="url(#fluke1)"/>
    </g>
    <text x="115" y="50" font-family="Inter, system-ui, sans-serif" font-size="42" font-weight="700" fill="#f1f5f9" letter-spacing="-1.5">fluken</text>
  </g>

  <text x="80" y="170" font-family="JetBrains Mono, monospace" font-size="13" fill="#67e8f9" letter-spacing="2" text-transform="uppercase">// THE OPINIONATED SDK FOR DEEPSEEK V4</text>

  <!-- Stack layers -->
  <g transform="translate(80, 230)">
    <!-- SDK layer -->
    <rect x="0" y="0" width="640" height="78" rx="10" fill="url(#sdk)" opacity="0.92"/>
    <rect x="0" y="0" width="640" height="78" rx="10" fill="none" stroke="#93c5fd" stroke-width="1" opacity="0.4"/>
    <text x="24" y="34" font-family="JetBrains Mono, monospace" font-size="14" fill="#e0e7ff" opacity="0.7" letter-spacing="1">@fluken/sdk</text>
    <text x="24" y="62" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#ffffff">hooks · permissions · sessions · tools · structured outputs · v4 extensions</text>

    <!-- Core layer -->
    <rect x="0" y="95" width="640" height="78" rx="10" fill="url(#core)" opacity="0.92"/>
    <rect x="0" y="95" width="640" height="78" rx="10" fill="none" stroke="#93c5fd" stroke-width="1" opacity="0.4"/>
    <text x="24" y="129" font-family="JetBrains Mono, monospace" font-size="14" fill="#e0e7ff" opacity="0.7" letter-spacing="1">@fluken/core</text>
    <text x="24" y="157" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#ffffff">codec · providers · transport · retries · cost telemetry</text>

    <!-- DSML layer -->
    <rect x="0" y="190" width="640" height="78" rx="10" fill="url(#dsml)" opacity="0.92"/>
    <rect x="0" y="190" width="640" height="78" rx="10" fill="none" stroke="#93c5fd" stroke-width="1" opacity="0.4"/>
    <text x="24" y="224" font-family="JetBrains Mono, monospace" font-size="14" fill="#e0e7ff" opacity="0.7" letter-spacing="1">@fluken/dsml</text>
    <text x="24" y="252" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#ffffff">parser · serializer · streaming state machine</text>
  </g>

  <!-- Right side: adapters -->
  <g transform="translate(800, 230)">
    <text x="0" y="0" font-family="JetBrains Mono, monospace" font-size="11" fill="#67e8f9" letter-spacing="2">// ADAPTERS</text>

    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="320" height="40" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="14" y="25" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#e2e8f0">vision-anthropic · openai · gemini · vl2 · florence2</text>
    </g>
    <g transform="translate(0, 70)">
      <rect x="0" y="0" width="320" height="40" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="14" y="25" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#e2e8f0">embeddings-voyage · openai · cohere · bge</text>
    </g>
    <g transform="translate(0, 120)">
      <rect x="0" y="0" width="320" height="40" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="14" y="25" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#e2e8f0">sandbox-local · docker · apple-vz · e2b · fend</text>
    </g>
    <g transform="translate(0, 170)">
      <rect x="0" y="0" width="320" height="40" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="14" y="25" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#e2e8f0">observability-otel · langfuse</text>
    </g>
  </g>

  <!-- footer -->
  <g transform="translate(80, 595)">
    <text x="0" y="0" font-family="JetBrains Mono, monospace" font-size="11" fill="#94a3b8" letter-spacing="1">MIT · typescript-first · content-block native</text>
  </g>
  <g transform="translate(1120, 595)">
    <text x="0" y="0" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="11" fill="#475569" letter-spacing="1">v0.1 · coming soon</text>
  </g>
</svg>
